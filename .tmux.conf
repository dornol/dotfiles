# prefix를 Ctrl+a로 변경
unbind C-b
set -g prefix C-a
set -g prefix2 C-b
bind C-a send-prefix
bind C-b send-prefix

# 마우스 지원
set -g mouse on

# 창 분할 단축키 직관적으로 변경 (| 세로, - 가로)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# 새 창 열 때 현재 경로 유지
bind c new-window -c "#{pane_current_path}"

# 창 간 이동 (vim 방향키)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 창 크기 조절
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 설정 리로드
bind r source-file ~/.tmux.conf \; display "설정 리로드됨"

# 인덱스 1부터 시작
set -g base-index 1
setw -g pane-base-index 1

# 256 컬러
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# 터미널 리사이즈 시 pane 크기 즉시 반영 (가장 큰 클라이언트 기준)
setw -g aggressive-resize on
# nvim 등 앱이 포커스/리사이즈 이벤트를 받을 수 있도록 허용
set -g focus-events on

# Esc 딜레이 제거 (vim/nvim 필수)
set -sg escape-time 0

# 히스토리
set -g history-limit 10000

# 플러그인
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# tmux-resurrect: 세션 저장/복원
# 저장 경로 고정 (지정 안 하면 디렉토리 존재 여부에 따라 경로가 바뀌어 복원 실패 가능)
set -g @resurrect-dir "$HOME/.local/share/tmux/resurrect"
set -g @resurrect-capture-pane-contents 'on'
bind C-s run-shell '~/.tmux/plugins/tmux-resurrect/scripts/save.sh'
bind C-r run-shell '~/.tmux/plugins/tmux-resurrect/scripts/restore.sh'

run '~/.tmux/plugins/tpm/tpm'

# 상태바
set -g status-position bottom
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left-length 50
set -g status-left "#[fg=#7aa2f7,bold] #S #[fg=#565f89]│#[fg=#e0af68] #h "
set -g status-right "#[fg=#565f89]#(if command -v free >/dev/null 2>&1; then free -m | awk '/Mem/{printf \"%.1fG\", $3/1024}'; elif [ \"$(uname -s)\" = Darwin ]; then vm_stat | awk '/Pages active|Pages wired down|Pages occupied by compressor/ {value = $0; sub(/^.* /, \"\", value); gsub(\"\\\\.\", \"\", value); used += value * 4096} END {if (used > 0) printf \"%.1fG\", used / 1024 / 1024 / 1024}'; fi) #[fg=#565f89]│#[fg=#7aa2f7] %Y-%m-%d %H:%M "
set -g window-status-current-style "bg=#7aa2f7,fg=#1a1b26,bold"
set -g window-status-current-format " #I:#W #[fg=#1a1b26,bg=#7aa2f7]#{b:pane_current_path} "
set -g window-status-format "#[fg=#565f89] #I:#W #{b:pane_current_path} "

# 활동 알림
set -g monitor-activity on
set -g visual-activity off
set -g window-status-activity-style "fg=#e0af68,bold"
