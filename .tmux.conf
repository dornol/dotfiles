# prefix를 Ctrl+a로 변경
unbind C-b
set -g prefix C-a
set -g prefix2 C-b
bind C-a send-prefix
bind C-b send-prefix

# 마우스 지원
set -g mouse on

# 창 분할 단축키 직관적으로 변경 (| 세로, - 가로)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# 새 창 열 때 현재 경로 유지
bind c new-window -c "#{pane_current_path}"

# 창 간 이동 (vim 방향키)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 창 크기 조절
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 설정 리로드
bind r source-file ~/.tmux.conf \; display "설정 리로드됨"

# 인덱스 1부터 시작
set -g base-index 1
setw -g pane-base-index 1

# 256 컬러
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# 터미널 리사이즈 시 pane 크기 즉시 반영 (가장 큰 클라이언트 기준)
setw -g aggressive-resize on
# nvim 등 앱이 포커스/리사이즈 이벤트를 받을 수 있도록 허용
set -g focus-events on

# Esc 딜레이 제거 (vim/nvim 필수)
set -sg escape-time 0

# 히스토리
set -g history-limit 10000

# 상태바
set -g status-position bottom
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left "#[fg=#7aa2f7,bold] #S "
set -g status-right "#[fg=#7aa2f7] %Y-%m-%d %H:%M "
set -g window-status-current-format "#[fg=#7aa2f7,bold] #I:#W "
set -g window-status-format "#[fg=#565f89] #I:#W "
