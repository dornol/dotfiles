name: Check dotfiles
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y stow zsh jq
      - run: python3 -m unittest discover -s tests -v
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install stow jq
      - run: python3 -m unittest discover -s tests -v
  neovim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim
        run: |
          bash bin/dotfiles-install-nvim https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz "$RUNNER_TEMP/nvim" "$RUNNER_TEMP/nvim-bin"
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$RUNNER_TEMP/nvim-bin" "$RUNNER_TEMP/bin/nvim"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Restore plugins and verify startup in an isolated profile
        run: python3 tests/check_nvim.py
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Check installation and removal in a temporary profile
        shell: pwsh
        run: ./tests/check-windows.ps1
      - name: Check compatibility with Windows PowerShell
        shell: powershell
        run: ./tests/check-windows.ps1
